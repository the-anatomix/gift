<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>갓 구운 선물 | 미니 주방 시안</title>
<meta name="description" content="작은 주방에서 막대과자에 초콜릿을 입히고 토핑을 뿌려 보는 3D 시안입니다.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFF8EC">
<style>
:root{
  --bg:#FFF8EC; --ink:#2B1D14; --sub:#8A7868; --line:#EADCC6; --card:#FFFCF5;
  --choc:#5A3824; --accent:#D9483B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
body{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 30%,#FFFBF2 0%,#FBEFD9 60%,#F3E0C2 100%);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;touch-action:manipulation}

#top{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 12px 0;
  display:flex;align-items:center;justify-content:space-between;pointer-events:none}
#top .brand{font-weight:800;font-size:15px;letter-spacing:-.02em;display:flex;align-items:center;gap:6px}
#top .tag{font-size:11px;font-weight:800;background:var(--choc);color:#FFF4E0;padding:2px 7px;border-radius:999px}
#top a{pointer-events:auto;min-height:44px;min-width:44px;padding:0 12px;display:inline-flex;align-items:center;
  font-size:13px;font-weight:700;color:var(--choc);text-decoration:none;background:rgba(255,252,245,.85);
  border:1.5px solid var(--line);border-radius:999px}

#account{font-size:12px;font-weight:600;color:var(--sub)}
#inapp{position:absolute;left:10px;right:10px;top:calc(60px + env(safe-area-inset-top));margin:0 auto;max-width:460px;
  background:#FFFCF5;border:1.5px solid var(--choc);border-radius:16px;padding:10px 12px;box-shadow:0 6px 20px rgba(90,56,36,.18)}
#inapp[hidden]{display:none}
#inapp p{margin:0 0 8px;font-size:13px;font-weight:600;line-height:1.45}
#inapp p small{display:block;font-weight:500;color:var(--sub);font-size:12.5px}
.copyurl.main{background:var(--choc);border-color:var(--choc);color:#FFF4E0}
#fallback .btn{min-height:48px;padding:0 18px;font-size:14px}

#labels{position:absolute;inset:0;pointer-events:none;transition:opacity .25s}
#labels.off{opacity:0}
#labels.off .lab{pointer-events:none}
.lab{position:absolute;left:0;top:0;min-width:44px;min-height:44px;padding:0;border:0;background:none;
  pointer-events:auto;cursor:pointer;display:flex;align-items:center;justify-content:center;will-change:transform}
.lab span{display:block;padding:6px 11px;border-radius:999px;background:#FFFCF5;color:var(--choc);
  font-size:13px;font-weight:800;box-shadow:0 2px 8px rgba(90,56,36,.22);white-space:nowrap}
.lab.live span{background:var(--choc);color:#FFF4E0}

#bottom{position:absolute;left:0;right:0;bottom:0;padding:0 10px calc(8px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#bottom>*{pointer-events:auto;width:100%;max-width:460px}
#panel{background:rgba(255,252,245,.96);border:1.5px solid var(--line);border-radius:18px;padding:10px 12px;
  box-shadow:0 6px 20px rgba(90,56,36,.12)}
#panel:empty{display:none}
.row{display:flex;align-items:center;gap:8px}
.row+.row{margin-top:8px}
.hint{flex:1;min-width:0;font-size:13.5px;font-weight:600;line-height:1.4;color:var(--ink)}
.hint small{display:block;font-weight:500;color:var(--sub);font-size:12.5px}
.soon{flex:none;font-size:12px;font-weight:800;background:#F3E3C8;color:var(--choc);padding:5px 10px;border-radius:999px}
.btn{flex:none;min-height:44px;min-width:44px;padding:0 13px;border-radius:12px;border:1.5px solid var(--line);
  background:#fff;font-size:13px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.4}
.btn:active:not(:disabled){transform:scale(.96)}
.sw{flex:1;min-width:44px;height:48px;padding:0;border:0;background:none;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--sub)}
.sw i{width:30px;height:30px;border-radius:50%;display:block;border:2px solid rgba(43,29,20,.12);
  box-shadow:0 0 0 0 var(--choc);transition:box-shadow .15s}
.sw[aria-pressed=true]{color:var(--ink)}
.sw[aria-pressed=true] i{box-shadow:0 0 0 2px #fff,0 0 0 4.5px var(--choc)}
.chip{flex:1;min-width:0;min-height:44px;padding:0 4px;border-radius:12px;border:1.5px solid var(--line);background:#fff;
  font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.chip i{width:10px;height:10px;border-radius:50%;display:block;flex:none}
.carve{flex:1;min-width:0;min-height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;
  font:inherit;font-size:16px;font-weight:700;background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text;outline:none}
.carve:focus{border-color:var(--choc)}
.carve::placeholder{font-weight:500;color:#B5A594}
.chip[aria-pressed=true]{background:var(--choc);border-color:var(--choc);color:#FFF4E0}

#tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:rgba(255,252,245,.96);
  border:1.5px solid var(--line);border-radius:18px;padding:4px;box-shadow:0 6px 20px rgba(90,56,36,.12)}
#tabs button{min-height:46px;min-width:0;padding:0;border:0;border-radius:14px;background:none;font-size:12.5px;
  font-weight:700;color:var(--sub);cursor:pointer;letter-spacing:-.03em;white-space:nowrap}
#tabs button[aria-selected=true]{background:var(--choc);color:#FFF4E0}

#duo{background:rgba(255,252,245,.96);border:1.5px solid var(--line);border-radius:18px;padding:10px 12px;
  box-shadow:0 6px 20px rgba(90,56,36,.12)}
#duo[hidden]{display:none}
#duo .grow{flex:1;min-width:0;padding:0 8px}
#duo .main{background:var(--choc);border-color:var(--choc);color:#FFF4E0}
#duo .who{flex:1;min-width:0;display:flex;align-items:center;gap:5px;font-size:13.5px;font-weight:800;white-space:nowrap}
#duo .who i{width:12px;height:12px;border-radius:50%;display:block;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
#duo .who i+i{margin-left:-7px}
#duo .emoji{width:44px;padding:0;font-size:20px}
#duo .url{flex:1;min-width:0;min-height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 10px;
  font:inherit;font-size:13px;background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text}
#hand{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:3px solid #fff;
  box-shadow:0 2px 8px rgba(43,29,20,.3);opacity:0;pointer-events:none;transition:opacity .2s,transform .09s linear;will-change:transform}
#hand.on{opacity:.85}
#emos{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.emo{position:absolute;bottom:38%;font-size:40px;animation:emo 1.6s ease-out forwards}
@keyframes emo{0%{transform:translateY(0) scale(.4);opacity:0}15%{transform:translateY(-30px) scale(1.1);opacity:1}
  100%{transform:translateY(-240px) scale(1);opacity:0}}

/* 편지 쓰기 · 받은 선물 */
#letter,#rcard{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(43,29,20,.35);
  padding:12px 10px calc(10px + env(safe-area-inset-bottom))}
#letter[hidden],#rcard[hidden],#recv[hidden]{display:none}
#rcard{background:none;pointer-events:none;align-items:center;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.sheet{width:100%;max-width:460px;max-height:100%;overflow:auto;background:#FFFCF5;border:1.5px solid var(--line);border-radius:20px;
  padding:14px 14px 12px;box-shadow:0 10px 30px rgba(43,29,20,.25);display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.sheet h2{margin:0;font-size:16px;font-weight:900;display:flex;justify-content:space-between;align-items:center}
.sheet label{font-size:12.5px;font-weight:700;color:var(--sub);display:flex;flex-direction:column;gap:4px}
.sheet input,.sheet textarea{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;
  padding:10px 12px;min-height:44px;outline:none;user-select:text;-webkit-user-select:text;width:100%}
.sheet textarea{min-height:104px;resize:none;line-height:1.5}
.sheet input:focus,.sheet textarea:focus{border-color:var(--choc)}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .main{background:var(--choc);border-color:var(--choc);color:#FFF4E0;flex:1}
.paper{background:#fff;border-radius:14px;border:1.5px dashed var(--choc);padding:16px;font-size:17px;line-height:1.6;display:flex;flex-direction:column;gap:8px}
.paper .body{white-space:pre-wrap;word-break:break-word;min-height:60px;user-select:text;-webkit-user-select:text}
.paper .to{font-weight:800}.paper .from{font-weight:800;text-align:right}
#recv{background:rgba(255,252,245,.96);border:1.5px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:0 6px 20px rgba(90,56,36,.12)}
#recv .main{background:var(--choc);border-color:var(--choc);color:#FFF4E0}
body.recv #tabs,body.recv #panel,body.recv #duo,body.recv #labels{display:none}

#toast{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translate(-50%,-8px);
  background:rgba(43,29,20,.88);color:#FFF4E0;font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;max-width:92vw}
#toast.on{opacity:1;transform:translate(-50%,0)}

#loading,#fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:24px;text-align:center;background:var(--bg)}
#loading{font-size:14px;font-weight:700;color:var(--sub);transition:opacity .4s}
#loading.done{opacity:0;pointer-events:none}
#fallback[hidden]{display:none}
#fallback h2{margin:0;font-size:20px;font-weight:900}
#fallback p{margin:0;font-size:14px;line-height:1.6;color:var(--sub);max-width:300px}
#fallback a{min-height:48px;padding:0 22px;display:inline-flex;align-items:center;border-radius:14px;
  background:var(--choc);color:#FFF4E0;font-weight:800;font-size:15px;text-decoration:none}
</style>
</head>
<body>
<canvas id="c" aria-label="3D 미니 주방" tabindex="-1"></canvas>
<div id="labels" aria-label="주방 자리"></div>
<div id="hand" aria-hidden="true"></div>
<div id="emos" aria-hidden="true"></div>
<div id="top">
  <div class="brand">갓 구운 선물 <span class="tag">미니 주방 시안</span><span id="account" hidden></span></div>
  <a href="../">2D 판</a>
</div>
<div id="inapp" hidden>
  <p>앱 안 브라우저로 열렸어요.<small>여기서는 3D 화면이나 "같이 굽기" 연결이 안 될 수 있어요. 주소를 복사해 기본 브라우저(사파리·크롬)에 붙여 열어 주세요.</small></p>
  <div class="row"><button type="button" class="btn copyurl main" style="flex:1">주소 복사</button><button type="button" class="btn" id="inappClose">닫기</button></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="bottom">
  <div id="recv" hidden>
    <div class="row"><div class="hint" id="rcHint">선물이 도착했어요.</div>
      <button type="button" class="btn main" id="rcOpen">열어 보기</button>
      <button type="button" class="btn" id="rcToggle" hidden>과자 보기</button>
      <button type="button" class="btn main" id="rcMake" hidden>나도 만들기</button></div>
  </div>
  <div id="duo" hidden></div>
  <div id="panel"></div>
  <nav id="tabs" role="tablist" aria-label="자리 이동"></nav>
</div>
<div id="rcard" hidden>
  <div class="sheet"><div class="paper"><div class="to" id="rcTo"></div><div class="body" id="rcMsg"></div><div class="from" id="rcFrom"></div></div></div>
</div>
<div id="letter" hidden>
  <div class="sheet">
    <h2>편지 쓰기 <button type="button" class="btn" id="ltClose">닫기</button></h2>
    <div class="two">
      <label>받는 사람<input id="ltTo" type="text" maxlength="12" autocomplete="off" placeholder="예: 지우"></label>
      <label>보내는 사람<input id="ltFrom" type="text" maxlength="12" autocomplete="off" placeholder="예: 민서"></label>
    </div>
    <label>편지 <span id="ltCount" style="align-self:flex-end;margin-top:-18px;font-weight:500">0 / 200</span>
      <textarea id="ltMsg" maxlength="200" placeholder="직접 구운 과자와 함께 전할 말을 적어 주세요."></textarea></label>
    <input id="ltUrl" type="text" readonly hidden aria-label="보낼 링크">
    <div class="hint" id="ltUrlHint" hidden><small>링크를 길게 눌러 복사해 보내 주세요.</small></div>
    <div class="row"><button type="button" class="btn main" id="ltShare">선물 링크 보내기</button></div>
  </div>
</div>
<div id="loading">주방을 차리는 중…</div>
<div id="fallback" hidden>
  <h2>3D 주방을 열 수 없어요</h2>
  <p>이 기기나 브라우저에서는 3D 화면을 쓸 수 없어요. 같은 선물을 2D 판에서 만들 수 있어요.</p>
  <p id="fbInapp" hidden>앱 안 브라우저라면 주소를 복사해 기본 브라우저(사파리·크롬)에서 열면 될 수도 있어요.</p>
  <a href="../">2D 판으로 가기</a>
  <button type="button" class="btn copyurl">주소 복사</button>
</div>
<script>
// 모듈을 못 읽거나 WebGL 이 없을 때 보여 주는 안내
window.__fallback = function () {
  document.getElementById('fallback').hidden = false;
  document.getElementById('inapp').hidden = true;
  var l = document.getElementById('loading'); if (l) l.remove();
};
// 인스타·카카오톡 같은 앱 안 브라우저 알아보기 (3D 가 안 떠도 돌아야 해서 모듈 밖에 둔다)
(function () {
  var inapp = /KAKAOTALK|Instagram|FBAN|FBAV|FB_IAB|NAVER\(inapp|Line\/|DaumApps|everytimeApp|; wv\)/i.test(navigator.userAgent);
  window.__inapp = inapp;
  if (inapp) { document.getElementById('inapp').hidden = false; document.getElementById('fbInapp').hidden = false; }
  document.getElementById('inappClose').addEventListener('click', function () { document.getElementById('inapp').hidden = true; });
  function done(b, ok) { var t = b.textContent; b.textContent = ok ? '복사했어요' : '주소창에서 직접 복사해 주세요'; setTimeout(function () { b.textContent = t; }, 1800); }
  function copy(b) {
    var url = location.href;
    function old() {
      var ta = document.createElement('textarea'); ta.value = url; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, url.length);
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove(); done(b, ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(function () { done(b, true); }, old); else old();
  }
  Array.prototype.forEach.call(document.querySelectorAll('.copyurl'), function (b) { b.addEventListener('click', function () { copy(b); }); });
})();
</script>
<script nomodule>window.__fallback();</script>
<script type="module" src="./app.js" onerror="window.__fallback()"></script>
<script type="module" src="./duo.js"></script>
<script type="module" src="./gift.js"></script>
</body>
</html>
