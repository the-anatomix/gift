<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>갓 구운 선물 | 돈신호등</title>
<meta name="description" content="직접 반죽해서 구운 막대과자와 쪽지가 도착했어요. 눌러서 오븐을 열어 보세요.">
<meta property="og:type" content="website">
<meta property="og:title" content="갓 구운 선물이 도착했어요">
<meta property="og:description" content="직접 반죽해서 구운 막대과자와 쪽지가 들어 있어요. 눌러서 오븐을 열어 보세요.">

<style>
:root{
  --bg:#FFF8EC; --ink:#1E1B16; --sub:#7A7266; --line:#E6DCCB; --card:#FFFFFF;
  --red:#F03A2E; --yellow:#FFB800; --green:#00B262; --box:#FFE9A8; --boxdark:#F2D27A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif}
body{min-height:100dvh;display:flex;justify-content:center}
#app{width:100%;max-width:440px;padding:20px 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
h1{font-size:24px;font-weight:900;line-height:1.25;margin:4px 0 0;letter-spacing:-.02em}
.lead{color:var(--sub);font-size:14px;margin:0;line-height:1.5}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--sub)}
.lights{display:flex;gap:4px}.lights i{width:9px;height:9px;border-radius:50%;display:block}
.lights i:nth-child(1){background:var(--red)}.lights i:nth-child(2){background:var(--yellow)}.lights i:nth-child(3){background:var(--green)}
.badge{display:inline-block;background:var(--yellow);color:var(--ink);font-weight:900;font-size:12px;padding:3px 8px;border-radius:6px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px}
.label{font-size:13px;font-weight:700;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.label small{font-weight:500;color:var(--sub)}
.tray{display:flex;justify-content:center;gap:6px;background:var(--box);border-radius:12px;padding:12px 6px 10px;border:1.5px solid var(--boxdark)}
.stick{background:none;border:0;padding:3px;border-radius:12px;cursor:pointer;line-height:0}
.stick.sel{background:#fff;box-shadow:0 0 0 2px var(--ink)}
.stick svg{width:42px;height:140px;display:block}
.editor{display:flex;gap:14px;margin-top:14px;align-items:flex-start}
.padwrap{flex:none}
.pad{width:120px;height:400px;background:var(--box);border:1.5px solid var(--boxdark);border-radius:14px;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none;line-height:0}
.pad svg{width:100%;height:100%;display:block;pointer-events:none}
.side{flex:1;min-width:0}
.side .chip{padding:8px 10px}.side .chip .dot{width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px;min-height:40px}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.row{display:flex;gap:8px}
input,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:0;border-color:var(--ink)}
textarea{resize:none;height:120px;font-family:"Gaegu",cursive;font-size:20px;line-height:1.4}
.btn{width:100%;border:0;border-radius:14px;padding:16px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff;min-height:54px}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.small{padding:10px 14px;font-size:13px;min-height:40px;width:auto;border-radius:999px}
.btn:active{transform:scale(.98)}
.hint{font-size:12px;color:var(--sub);margin:0;line-height:1.5}
.toast{max-width:92vw;position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}
/* 받는 화면 */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;min-height:70dvh}
.giftbox{position:relative;width:250px;height:290px}
.base{position:absolute;left:0;right:0;bottom:0;height:240px;background:var(--box);border:2px solid var(--ink);border-radius:14px;display:flex;justify-content:center;align-items:flex-end;gap:4px;padding:0 0 14px;overflow:hidden}
.base .stick{pointer-events:none;padding:0}.base .stick svg{width:40px;height:133px}
.lid{position:absolute;left:-8px;right:-8px;top:34px;height:262px;background:var(--yellow);border:2px solid var(--ink);border-radius:16px;transition:transform .9s cubic-bezier(.3,1.3,.5,1),opacity .6s .3s;display:flex;align-items:center;justify-content:center}
.lid::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:26px;margin-left:-13px;background:var(--red);border-left:2px solid var(--ink);border-right:2px solid var(--ink)}
.lid::after{content:"";position:absolute;left:0;right:0;top:50%;height:26px;margin-top:-13px;background:var(--red);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.lid span{position:relative;z-index:1;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:6px 12px;font-family:"Gaegu",cursive;font-size:22px;font-weight:700;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.giftbox.open .lid{transform:translateY(-120%) rotate(-8deg);opacity:0}
.giftbox.shake .lid{animation:shake 2.4s ease-in-out infinite}
@keyframes shake{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-2deg)}84%{transform:rotate(2deg)}92%{transform:rotate(-1deg)}}
.letter{width:100%;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:20px 18px 16px;text-align:left;font-family:"Gaegu",cursive;font-size:24px;line-height:36px;min-height:220px;background-image:repeating-linear-gradient(transparent 0 35px,var(--line) 35px 36px);background-position:0 20px;white-space:pre-wrap;word-break:break-word;position:relative}
.letter .to{font-weight:700}
.letter .from{text-align:right;font-weight:700;min-height:36px}
.caret::after{content:"";display:inline-block;width:2px;height:22px;background:var(--ink);vertical-align:-3px;margin-left:2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.mini{display:flex;justify-content:center;gap:6px}.mini .stick{pointer-events:none;padding:0}.mini svg{width:27px;height:90px}
.fade{animation:fade .5s both}@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.foot{font-size:12px;color:var(--sub);text-align:center;line-height:1.6}
.foot a{color:var(--ink);font-weight:700;text-decoration:none}
/* 반죽 · 자르기 · 굽기 */
.steps{display:flex;gap:6px}.steps span{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--sub);padding:6px 0;border-radius:999px;background:#F3EADB}
.steps span.on{background:var(--ink);color:#fff}.steps span.done{background:var(--yellow);color:var(--ink)}
.zone{height:300px;display:flex;align-items:center;justify-content:center;background:#F6E7C8;border:1.5px solid var(--boxdark);border-radius:16px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;overflow:hidden}
.dough{width:190px;height:150px;background:#F3E2B8;border:2.5px solid var(--ink);border-radius:42% 58% 63% 37%/45% 40% 60% 55%;transition:transform .12s,border-radius .4s;box-shadow:inset -14px -12px 0 rgba(0,0,0,.07);pointer-events:none}
.dough.done{border-radius:50%}
.bar{height:14px;background:#F3EADB;border-radius:999px;overflow:hidden;border:1.5px solid var(--ink)}.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .15s}
.board{height:300px;position:relative;background:#E9C99A;border:1.5px solid var(--ink);border-radius:16px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;overflow:hidden}
.strips{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-end;gap:22px;padding-bottom:16px;pointer-events:none}
.strip{width:26px;display:flex;flex-direction:column;justify-content:flex-end}
.strip .off,.strip .keep{background:#F3E2B8;border:2px solid var(--ink)}
.strip .off{border-radius:13px 13px 0 0;border-bottom:0;opacity:.5;transition:transform .5s,opacity .5s}.strip .keep{border-radius:0 0 13px 13px}
.strip.cut .off{transform:translateY(-40px) rotate(14deg);opacity:0}.strip.cut .keep{border-radius:13px}.strip.now .keep,.strip.now .off{background:#FFF3CF}
.knife{position:absolute;left:8px;right:8px;height:0;border-top:3px dashed var(--red);pointer-events:none}
.knife b{position:absolute;right:0;top:-32px;background:var(--red);color:#fff;font-size:13px;padding:4px 10px;border-radius:999px;white-space:nowrap}
.oven{background:#3A3530;border:2px solid var(--ink);border-radius:20px;padding:16px}
.win{height:220px;border-radius:12px;border:2px solid var(--ink);background:#1E1B16;display:flex;justify-content:center;align-items:flex-end;gap:14px;padding-bottom:18px;overflow:hidden}
.win.hot{background:radial-gradient(circle at 50% 110%,#FF8A2A 0,#7A2A10 55%,#2A1410 100%)}
.bstick{width:22px;border-radius:11px;border:2px solid var(--ink);background:#F3E2B8}
.gauge{height:18px;margin:16px 4px 6px;border-radius:999px;border:2px solid var(--ink);position:relative;background:linear-gradient(90deg,#F3E2B8 0 45%,#00B262 45% 72%,#F03A2E 72% 100%)}
.gauge i{position:absolute;top:-7px;width:8px;height:28px;margin-left:-4px;background:#fff;border:2px solid var(--ink);border-radius:4px;left:0}
.result{font-weight:700;text-align:center;min-height:24px;margin:0}
.btn[disabled]{opacity:.35;cursor:default}
.btn.kakao{background:#FEE500;color:#191600}.btn.insta{background:linear-gradient(90deg,#F58529,#DD2A7B 55%,#8134AF);color:#fff}
:root.ax{--bg:#0B1426;--ink:#EAF6FF;--sub:#8FA6C0;--line:#22344F;--card:#111E36;--yellow:#FFB020;--green:#19E3E3;--red:#FF5A6E;--box:#16294A;--boxdark:#2A4470}
.ax .btn{color:#0B1426}.ax .btn.ghost{background:transparent;color:var(--ink)}.ax .btn.kakao{color:#191600}.ax .btn.insta{color:#fff}
.ax input,.ax textarea,.ax .chip{background:#0F1B31;color:var(--ink)}.ax .chip.on{background:var(--green);color:#0B1426;border-color:var(--green)}
.ax .steps span{background:#16294A}.ax .steps span.on{background:var(--green);color:#0B1426}.ax .steps span.done{background:var(--yellow);color:#0B1426}
.ax .badge{color:#0B1426}.ax .stick.sel{background:#22344F;box-shadow:0 0 0 2px var(--green)}
.ax .zone,.ax .board{background:#16294A;border-color:#2A4470}.ax .bar{background:#16294A}
.ax .lid{background:#19E3E3;border-color:#EAF6FF}.ax .lid::before,.ax .lid::after{background:#FFB020;border-color:#0B1426}.ax .lid span{color:#0B1426;border-color:#0B1426}
.ax .letter{background:#F7FBFF;color:#0B1426;border-color:#19E3E3}.ax .toast{background:#19E3E3;color:#0B1426}.ax .foot a{color:var(--green)}
.ax .lights i:nth-child(1){background:#19E3E3}.ax .lights i:nth-child(2){background:#FFB020}.ax .lights i:nth-child(3){background:#FF5A6E}
/* 받는 화면: 오븐 문 · 식힘망 · 레시피 쪽지 (참고 릴스의 리본 상자·줄 편지지와 다르게) */
.giftbox{width:270px;height:300px}
.base{height:300px;background:repeating-linear-gradient(90deg,#D8D0C2 0 3px,transparent 3px 22px),#F4EFE6;border-radius:18px;padding:0 0 18px;gap:4px}
.lid{left:0;right:0;top:0;height:300px;background:#3A3530;border-radius:18px;flex-direction:column;gap:16px;transition:transform .9s cubic-bezier(.5,0,.3,1),opacity .5s .5s}
.lid::before,.lid::after{content:none}
.lid .owin{width:206px;height:150px;border-radius:14px;border:2px solid #1E1B16;background:radial-gradient(circle at 50% 115%,#FF8A2A 0,#7A2A10 55%,#2A1410 100%);display:flex;align-items:flex-end;justify-content:center;gap:10px;padding-bottom:14px;box-sizing:border-box}
.lid .owin b{width:13px;border-radius:7px;background:#1E1B16;opacity:.6;display:block}
.lid .ohandle{width:150px;height:12px;border-radius:6px;background:#B9AF9F;border:2px solid #1E1B16}
.lid span{font-size:20px;padding:3px 12px}
.giftbox.open .lid{transform:translateY(108%);opacity:0;pointer-events:none}
.letter{background-image:none;border:2px dashed var(--ink);border-radius:16px;padding:16px 18px;min-height:0;line-height:1.5;font-size:23px;font-family:inherit}
.letter .rhead{font-family:"Noto Sans KR",sans-serif;font-weight:900;font-size:15px;display:flex;justify-content:space-between;gap:8px;border-bottom:2px solid currentColor;padding-bottom:8px}
.letter .spec{font-family:"Noto Sans KR",sans-serif;font-size:12.5px;font-weight:500;color:#7A7266;display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;padding:8px 0;border-bottom:1px dashed #B9AF9F}
.letter .body{min-height:100px;white-space:pre-wrap;word-break:break-word;margin-top:10px}
.ax .lid{background:#16294A;border-color:#19E3E3}.ax .lid .owin{border-color:#19E3E3}.ax .lid .ohandle{background:#19E3E3;border-color:#0B1426}
.ax .base{background:repeating-linear-gradient(90deg,#2A4470 0 3px,transparent 3px 22px),#0F1B31;border-color:#19E3E3}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.lid,.fade,.giftbox.shake .lid{animation:none;transition:none}}
</style>
</head>
<body>

<div class="toast" id="toast" role="status"></div>
<script>
(function(){
"use strict";
var COATS=[["밀크초코","#6B3F2A"],["다크초코","#33201A"],["화이트","#F7ECDC"],["딸기","#F29BB0"],["말차","#9BBF6A"]];
var TOOLS=["스프링클","하트","별","견과","초코펜","화이트펜"];
var STEP=[7,15,15,9,4,4], MAXP=100;
var BAKE=["#F3E2B8","#E3B877","#8A5A30"];
var FONTS=["Gaegu","Nanum Pen Script","Nanum Myeongjo","Noto Sans KR"],FNAMES=["손글씨","펜글씨","명조","고딕"];
var INSTA="https://www.instagram.com/donsignal.kr/";
/* 주소에 ?b=ax 가 붙으면 아나토믹스 판(이름·색·문구)으로 바뀐다 */
var AX=/[?&]b=ax(&|$)/.test(location.search);
var BR=AX?{name:"ANATOMIX",insta:"https://www.instagram.com/the.anatomix/",at:"@the.anatomix",badge:"0kcal 선물",tag:"사물의 속을 3D로 해부해요 "}
        :{name:"돈신호등",insta:INSTA,at:"@donsignal.kr",badge:"직접 구운 선물",tag:"생활 속 돈 정보 "};
if(AX)document.documentElement.classList.add("ax");
var app=document.getElementById("app");

function el(tag,attrs,kids){var n=document.createElement(tag);if(attrs)for(var k in attrs){if(k==="text")n.textContent=attrs[k];else if(k==="on")for(var e in attrs.on)n.addEventListener(e,attrs.on[e]);else n.setAttribute(k,attrs[k]);}
  (kids||[]).forEach(function(c){if(c)n.appendChild(c)});return n}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("show")},1800)}
function esc(c){return c.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

/* 막대과자: 그림 칸 60x200, 코팅은 x 12~48, y 4~154. 토핑은 [종류, x(0~31), y(0~255)] */
/* 길이(len 0~15)에 따라 과자 키가 120~200 으로 달라진다. 아래쪽을 맞춰 그린다 */
function geo(l){var H=120+(l==null?15:l)*80/15;return {H:H,y0:200-H,ch:H-50}}
function px(v){return 12+v*36/31} function py(v,G){return G.y0+10+v*(G.ch-12)/255}
function stickSVG(st,g){
  var G=geo(st.l),c=COATS[st.c][1],light=st.c>=2,o="",i,q,x,y,rot;
  o+='<rect x="19" y="'+(G.y0+8)+'" width="22" height="'+(G.H-14)+'" rx="11" fill="'+BAKE[g?g.bake:1]+'" stroke="#1E1B16" stroke-width="2"/>';
  o+='<rect x="12" y="'+(G.y0+4)+'" width="36" height="'+G.ch+'" rx="18" fill="'+c+'" stroke="#1E1B16" stroke-width="2"/>';
  o+='<rect x="17" y="'+(G.y0+16)+'" width="4" height="'+Math.min(62,G.ch-30)+'" rx="2" fill="#fff" opacity="'+(light?".5":".2")+'"/>';
  var cols=["#F03A2E","#FFB800","#00B262","#4A7BF7","#FFFFFF"];
  for(i=0;i<st.p.length;i++){q=st.p[i];x=px(q[1]).toFixed(1);y=py(q[2],G).toFixed(1);rot=(q[1]*37+q[2]*53)%180;
    if(q[0]===0)o+='<rect x="-3.5" y="-1.3" width="7" height="2.6" rx="1.3" fill="'+cols[(q[1]*7+q[2]*3)%5]+'" stroke="#1E1B16" stroke-width=".5" transform="translate('+x+' '+y+') rotate('+rot+')"/>';
    else if(q[0]===1)o+='<path transform="translate('+x+' '+y+') scale(.5) translate(0 -8)" d="M0 4C-8-4-14 4-8 10L0 18L8 10C14 4 8-4 0 4Z" fill="'+(st.c===3?"#fff":"#F03A2E")+'" stroke="#1E1B16" stroke-width="1.6"/>';
    else if(q[0]===2)o+='<path transform="translate('+x+' '+y+') rotate('+(rot%72)+') scale(.62)" d="M0-8L2.4-2.6L8-2.5L3.6 1.2L5 7L0 3.6L-5 7L-3.6 1.2L-8-2.5L-2.4-2.6Z" fill="#FFD23F" stroke="#1E1B16" stroke-width="1.3" stroke-linejoin="round"/>';
    else if(q[0]===3)o+='<ellipse rx="3.6" ry="2.3" fill="#C98F4E" stroke="#1E1B16" stroke-width=".8" transform="translate('+x+' '+y+') rotate('+rot+')"/>';
    else o+='<circle cx="'+x+'" cy="'+y+'" r="2.3" fill="'+(q[0]===4?"#33201A":"#FFF8EC")+'"/>';
  }
  /* 새긴 글자는 토핑 위에 보이게 맨 나중에 그린다 */
  var chs=Array.from(st.e||"").slice(0,6),n=Math.min(chs.length,Math.floor((G.ch-18)/13));
  if(n>0){var sp=Math.min(21,(G.ch-18)/n),fs=Math.min(20,sp+2);
    for(i=0;i<n;i++)o+='<text x="30" y="'+(G.y0+10+fs*.85+i*sp).toFixed(1)+'" text-anchor="middle" font-family="Gaegu,cursive" font-weight="700" font-size="'+fs.toFixed(1)+'" fill="'+(light?"#6B3F2A":"#FFE9B8")+'" stroke="'+c+'" stroke-width="3" paint-order="stroke" stroke-linejoin="round">'+esc(chs[i])+'</text>'}
  return '<svg viewBox="0 0 60 200" aria-hidden="true">'+o+'</svg>';
}
